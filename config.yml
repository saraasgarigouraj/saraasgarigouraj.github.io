  description: |
    Welcome!
    I am a Ph.D. candidate in Economics at the University of Oklahoma. My research is in energy and environmental economics, with a focus on electricity markets, transmission infrastructure, and the environmental consequences of market design. I will be on the job market in Fall 2026.

    My job market paper examines how the transition to market-based dispatch reshaped electricity generation and emissions in U.S. power markets, highlighting the tradeoffs between private cost savings, regional reallocation, and environmental damages.
